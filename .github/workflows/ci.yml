name: CI

on:
  push:
  pull_request:

# The test harness (test/test_helper.exs) fails closed unless DATABASE_URL
# targets the dedicated loopback ash_onetime_test database under the postgres
# user on a non-default port; CI pins the repo-default port 18841 and maps the
# Postgres service to it. The contention tests' observer sessions derive
# their connection from the Repo URL, so they follow the same port.
env:
  # Lockstep with mix.exs' `elixir:` support window (the pinned toolchain must
  # satisfy it) and .tool-versions — all three move together in ONE commit;
  # divergence between the three is a defect.
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.0.3"
  DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

jobs:
  # Compatibility matrix: the per-cell gate battery (format, compile
  # warnings-as-errors, hex.audit, deps.audit, test, credo --strict, dialyzer,
  # docs --warnings-as-errors, hex.build) across the supported Ash range —
  # the declared floor plus a floating `latest` cell that auto-exercises the
  # newest published Ash on every run. The release battery (mutation matrix,
  # unpacked-package check, DSL cheat-sheet freshness) is deliberately not
  # per-cell: it runs once in the release-checks job against the committed lock.
  compat:
    name: "Ash ${{ matrix.ash }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ash:
          - "3.33.4" # declared security floor (EEF-CVE-2026-86338 fixed only here; 82752/82xxx at or below; ADR 0004)
          - "latest" # floating >= 3.33.4, < 4.0.0 — newest published Ash 3.x

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_ASH_VERSION: ${{ matrix.ash }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-ash${{ matrix.ash }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-ash${{ matrix.ash }}-

      - name: Resolve the matrix Ash version
        # `== X` cells resolve to exactly X; the floating `latest` cell resolves to the
        # newest Ash satisfying `>= 3.33.4 and < 4.0.0`. Unlock first so the committed
        # lock's floor pin never holds a cell back.
        run: |
          mix deps.unlock ash
          mix deps.get
          mix deps.update ash

      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # hex.audit (not deps.audit) is what surfaces Hex security advisories such as
      # EEF-CVE-2026-55736; it fails the build on any retired/advised dependency.
      - run: mix hex.audit
      - run: mix deps.audit
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      # The test-env run also analyzes test/support — where the consumer-shaped
      # opacity fixture lives (a host module whose @spec speaks the opaque
      # AshOnetime.Verified.t()); the dev-env run above never compiles it.
      - run: MIX_ENV=test mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  # Version-independent release gates from CONTRIBUTING.md, run once against the
  # committed lock (the floating requirement — no ASH_ONETIME_ASH_VERSION pin here).
  release-checks:
    name: "Release gates"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-release-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-release-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Mutation battery
        run: MIX_ENV=test mix run scripts/check_mutations.exs -- all
      # check_package.exs inspects the built archive, so hex.build must precede it.
      - name: Build the Hex package
        run: mix hex.build
      - name: Unpacked consumer package check
        run: mix run scripts/check_package.exs
      # Fails when the committed documentation/dsls/DSL-*.md drifts from the declared schema.
      - name: DSL cheat-sheet freshness
        run: mix spark.cheat_sheets --check --extensions AshOnetime.Resource
      # Optional-integration matrix: which integrations compile per consumer dep set,
      # that no optional dep leaks into the runtime application closure, and two
      # conflict proofs — exact advised pins (igniter == 0.8.3, mint == 1.9.3)
      # must FAIL to resolve, proving the security floors bind in a real consumer
      # resolution (ADR 0004).
      - name: Optional integration matrix
        run: MIX_ENV=test mix run scripts/check_optional_matrix.exs

  # The other end of the OTP allowlist in config/config.exs: the dev gates run
  # on OTP 28 (the floor of the supported set) so an in-window contributor on
  # 28 is proven, not assumed. The allowlist grows only alongside a leg here.
  otp-28:
    name: "OTP 28"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OTP_VERSION: "28.5"
      DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-otp28leg-${{ hashFiles('mix.exs', 'mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix hex.audit
      - run: mix test
      - run: mix credo --strict