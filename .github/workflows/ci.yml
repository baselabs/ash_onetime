name: CI

# One qualification run per kci/<sha> candidate; qualified is its verdict.
# Only a candidate with a successful verdict can move main.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests require the dedicated loopback ash_onetime_test database as postgres.
# Use non-default port 18841 for the PostgreSQL service.
# Observer connections use the Repo URL. Each job's PostgreSQL is its own superuser
# container, so the privileged operation-hold tests run against it rather than skipping.
env:
  DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"
  ASH_ONETIME_SUPERUSER_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

jobs:
  # .tool-versions lists defaults first, followed by the compatibility pairs.
  # mix.exs owns the Ash security floor used by the compatibility matrix.
  # .github/service-pins owns the PostgreSQL server image digest and client version.
  toolchain:
    name: Read suite toolchains
    runs-on: ubuntu-24.04
    # Slowest green: 7 s, run 44145457629. Five minutes is the floor for any job.
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
      ash_floor: ${{ steps.versions.outputs.ash_floor }}
      postgres_image: ${{ steps.versions.outputs.postgres_image }}
      postgres_client: ${{ steps.versions.outputs.postgres_client }}
      pgdg_key: ${{ steps.versions.outputs.pgdg_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read defaults, compatibility lanes, Ash floor, and service pins
        id: versions
        uses: ./.github/actions/toolchain

  compat:
    name: "Ash ${{ matrix.ash }}"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 32 min (Ash latest), run 44190160838; about twice that.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # Floor: declared security floor (EEF-CVE-2026-96581; ADR 0004), locked in
        # locks/ash-floor/mix.lock.
        # Latest: the floating requirement, locked in mix.lock; the release gates' currency
        # check keeps that lock at the newest Ash 3.x.
        ash: ${{ fromJSON(format('["{0}","latest"]', needs.toolchain.outputs.ash_floor)) }}

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-compat-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-compat-${{ strategy.job-index }}"
      ASH_ONETIME_ASH_VERSION: ${{ matrix.ash }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/compat
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          ash: ${{ matrix.ash }}
          resolution: locked
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  release-checks:
    name: "Release gates"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 81 min, run 44145457629 (the mutation battery is 69 min of it); about twice that.
    timeout-minutes: 160

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-release
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-release"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-gates
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  compatibility:
    name: Compatibility (${{ matrix.elixir && format('Elixir {0}, OTP {1}', matrix.elixir, matrix.otp) || 'no second toolchain declared' }})
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 19 min, run 44190160838; about twice that.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # With no second toolchain in .tool-versions the job still runs, as one cell that
        # checks nothing and succeeds, so every result its verdict reads is a success.
        include: ${{ fromJSON(needs.toolchain.outputs.beam_lanes != '[]' && needs.toolchain.outputs.beam_lanes || '[{"elixir":"","otp":""}]') }}

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-lane-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-lane-${{ strategy.job-index }}"

    steps:
      - if: matrix.elixir == ''
        run: echo ".tool-versions declares no second toolchain; nothing to run"
      - if: matrix.elixir != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: matrix.elixir != ''
        uses: ./.github/actions/compatibility-lane
        with:
          elixir: ${{ matrix.elixir }}
          otp: ${{ matrix.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  security:
    name: "Security"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 2 min 9 s, run 44190160838 (three locks scanned). Five minutes is the floor for any job.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/security
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}

  # The one verdict a landing reads: every job above succeeded. A skipped, cancelled or
  # failed job refuses; no job is allowed to be absent.
  qualified:
    name: qualified
    if: always()
    needs: [toolchain, compat, release-checks, compatibility, security]
    runs-on: ubuntu-24.04
    # Slowest green: 6 s, run 44145457629. Five minutes is the floor for any job.
    timeout-minutes: 5
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [f"{name} ({job['result']})" for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed))
          PY
