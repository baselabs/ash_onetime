name: CI

on:
  push:
    branches: [main, 'kci/**'] # kci/<sha>: kimosabe-land's pre-merge run of this workflow
    tags: ['v*'] # Verify each tagged release artifact before manual Hex publication.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The test harness (test/test_helper.exs) fails closed unless DATABASE_URL
# targets the dedicated loopback ash_onetime_test database under the postgres
# user on a non-default port; CI pins the repo-default port 18841 and maps the
# Postgres service to it. The contention tests' observer sessions derive
# their connection from the Repo URL, so they follow the same port.
env:
  # Lockstep with mix.exs' `elixir:` support window (the pinned toolchain must
  # satisfy it) and .tool-versions — all three move together in ONE commit;
  # divergence between the three is a defect.
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1.2"
  DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

jobs:
  # Compatibility matrix: the per-cell gate battery (format, compile
  # warnings-as-errors, hex.audit, deps.audit, test, credo --strict, dialyzer,
  # docs --warnings-as-errors, hex.build) across the supported Ash range —
  # the declared floor plus a floating `latest` cell that auto-exercises the
  # newest published Ash on every run. The release battery (mutation matrix,
  # source Livebook execution, unpacked-package check, DSL cheat-sheet freshness)
  # runs once in the release-checks job against the committed lock.
  compat:
    name: "Ash ${{ matrix.ash }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ash:
          - "3.37.2" # declared security floor (EEF-CVE-2026-96581; ADR 0004)
          - "latest" # floating >= 3.37.2, < 4.0.0 — newest published Ash 3.x

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_ASH_VERSION: ${{ matrix.ash }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-ash${{ matrix.ash }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-ash${{ matrix.ash }}-

      - name: Resolve the matrix Ash version
        # `== X` cells resolve to exactly X; the floating `latest` cell resolves to the
        # newest Ash satisfying `>= 3.37.2 and < 4.0.0`. Resolve the full graph:
        # locked AshPostgres/AshSql versions can otherwise require a newer Ash
        # than the selected cell, concealing the consumer compatibility result.
        # Developer tools float with that graph, exercising current tool compatibility;
        # release-checks uses the committed lock for reproducible artifact verification.
        run: |
          mix deps.unlock --all
          mix deps.get

      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # hex.audit (not deps.audit) is what surfaces Hex security advisories such as
      # EEF-CVE-2026-55736; it fails the build on any retired/advised dependency.
      - run: mix hex.audit
      - run: mix deps.audit
      - run: mix test
        env:
          ASH_ONETIME_RLS_PRUNE_TESTS: "1"
      - run: mix credo --strict
      - run: mix dialyzer
      # The test-env run also analyzes test/support — where the consumer-shaped
      # opacity fixture lives (a host module whose @spec speaks the opaque
      # AshOnetime.Verified.t()); the dev-env run above never compiles it.
      - run: MIX_ENV='test' mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  # Version-independent release gates from CONTRIBUTING.md, run once against the
  # committed lock (the floating requirement — no ASH_ONETIME_ASH_VERSION pin here).
  release-checks:
    name: "Release gates"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-release-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-release-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Mutation battery
        run: MIX_ENV='test' mix run scripts/check_mutations.exs -- all
        env:
          ASH_ONETIME_RLS_PRUNE_TESTS: "1"
      # check_package.exs inspects the built archive, so hex.build must precede it.
      - name: Build the Hex package
        run: mix hex.build
      - name: Unpacked consumer package check
        run: mix run scripts/check_package.exs
      # Fails when the test repo's committed AshPostgres output (test/support/priv) is stale
      # against the locked AshPostgres, so the suite always runs with the consumer's helpers.
      - name: Ash codegen freshness
        run: MIX_ENV='test' mix ash.codegen --check
      # Fails when the committed documentation/dsls/DSL-*.md drifts from the declared schema.
      - name: DSL cheat-sheet freshness
        run: mix spark.cheat_sheets --check --extensions AshOnetime.Resource
      - name: Execute Livebook source cells
        run: elixir scripts/check_livebooks.exs --local
      # Optional-integration matrix: which integrations compile per consumer dep set,
      # that no optional dep leaks into the runtime application closure, and two
      # conflict proofs — exact advised pins (igniter == 0.8.3, mint == 1.10.1)
      # must FAIL to resolve, proving the security floors bind in a real consumer
      # resolution (ADR 0004).
      - name: Optional integration matrix
        run: MIX_ENV='test' mix run scripts/check_optional_matrix.exs

  # The other end of the OTP allowlist in config/config.exs: the dev gates run
  # on OTP 28 (the floor of the supported set) so an in-window contributor on
  # 28 is proven, not assumed. The allowlist grows only alongside a leg here.
  otp-28:
    name: "OTP 28"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OTP_VERSION: "28.5"
      DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-otp28leg-${{ hashFiles('mix.exs', 'mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix hex.audit
      - run: mix test
        env:
          ASH_ONETIME_RLS_PRUNE_TESTS: "1"
      - run: mix credo --strict

  # Supply-chain advisories on the committed lock, failing closed. osv-scanner (one pinned 2.x
  # release, checksum-verified) runs offline: the public Hex advisory database is downloaded
  # first, with nothing from the lock sent, and the scan then runs in a network namespace with
  # no network. It fails on any published advisory affecting a locked version, and with no
  # database. hex.audit fails on any retired package.
  security:
    name: "Security"
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: "2.7.1"
      OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install osv-scanner and download the Hex advisory database
        run: |
          curl -sSfLo "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          mkdir -p "$RUNNER_TEMP/osv-db/osv-scalibr/Hex"
          curl -sSfLo "$RUNNER_TEMP/osv-db/osv-scalibr/Hex/all.zip" \
            "https://osv-vulnerabilities.storage.googleapis.com/Hex/all.zip"

      - name: Scan mix.lock offline, with the network denied
        run: |
          if sudo unshare --net -- curl -sS -m 5 -o /dev/null https://osv.dev 2>/dev/null; then
            echo "network is reachable inside the scan namespace" >&2
            exit 1
          fi
          sudo unshare --net -- env OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$RUNNER_TEMP/osv-db" \
            "$RUNNER_TEMP/osv-scanner" scan source --offline -L mix.lock

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - run: mix deps.get
      - run: mix hex.audit
