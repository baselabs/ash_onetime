name: Work

# Every work head runs the qualification job definitions and shared actions, plus both
# committed-lock checks and the explicit quality/test jobs. Its verdict reports the work
# head; only ci.yml on kci/ can move main. Work refuses main and candidate refs and saves no cache.
on:
  push:
    branches-ignore: [main, 'kci/**']

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"
  ASH_ONETIME_SUPERUSER_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

jobs:
  toolchain:
    name: Refuse main and candidates; read toolchains
    runs-on: ubuntu-24.04
    # Same steps as ci.yml's toolchain job, slowest green 7 s, run 44145457629. Five minutes is
    # the floor for any job.
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
      ash_floor: ${{ steps.versions.outputs.ash_floor }}
      postgres_client: ${{ steps.versions.outputs.postgres_client }}
      postgres_lanes: ${{ steps.versions.outputs.postgres_lanes }}
      postgres_all_lanes: ${{ steps.versions.outputs.postgres_all_lanes }}
      pgdg_key: ${{ steps.versions.outputs.pgdg_key }}
      matrix_routes: ${{ steps.test-shards.outputs.matrix_routes }}
      scheduling_shards: ${{ steps.test-shards.outputs.scheduling_shards }}
      native_shards: ${{ steps.test-shards.outputs.native_shards }}
      mutation_shards: ${{ steps.versions.outputs.mutation_shards }}
    steps:
      # The default branch is read from the repository, as in every workflow here.
      - name: Refuse the default branch, candidates and anything not a branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          case "$REF" in
            "refs/heads/$default_branch" | refs/heads/kci/*)
              echo "::error::work runs refuse $REF: main and kci/ scopes feed qualification"
              exit 1 ;;
            refs/heads/*) ;;
            *)
              echo "::error::work runs only on branches, not $REF"
              exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read defaults and service pins at the branch head
        id: versions
        uses: ./.github/actions/toolchain
      - name: Read shared test partitions
        id: test-shards
        run: python3 scripts/ci_test_shards.py --outputs

  lock:
    name: Lock check
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 2 min 49 s, run 44201990085; about twice that.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      # Each cell is fetched and then audited before the next, because Mix checks deps/
      # against the cell's lock. deps.audit reads <path>/mix.lock, so it is pointed at each
      # cell's lock directory.
      - name: Check and audit both cells' committed locks
        env:
          ASH_FLOOR: ${{ needs.toolchain.outputs.ash_floor }}
        run: |
          for cell in latest "$ASH_FLOOR"; do
            export ASH_ONETIME_ASH_VERSION="$cell"
            if ! mix deps.get --check-locked; then
              echo "::error::the lock for Ash $cell is not current; resolve it with mix deps.get (ASH_ONETIME_ASH_VERSION=$cell) where mix.exs changed and commit it with that change"
              exit 1
            fi
            mix hex.audit
            lock_dir=$(mix run --no-start --no-compile --no-deps-check -e 'IO.write(Path.dirname(Mix.Project.config()[:lockfile]))')
            mix deps.audit --path "$lock_dir"
          done

  quality:
    name: Compile, docs, format, types and precommit
    needs: toolchain
    runs-on: ubuntu-24.04
    # Cold green: 9 min 35 s, Work 44838423147; about twice that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: ./.github/actions/mix-cache
        with:
          mode: restore
          cell: release
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - name: Format check
        id: format
        run: mix format --check-formatted
      - name: Export formatter changes on failure
        if: failure() && steps.format.outcome == 'failure'
        run: |
          mix format
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - name: Upload formatter changes
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-changes
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: error
          retention-days: 7
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV='test' mix compile --warnings-as-errors
      - run: mix docs --warnings-as-errors
      - run: mix precommit
      - run: mix dialyzer
      - run: MIX_ENV='test' mix dialyzer

  tests:
    name: Test suite
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 20 min, run 44190116854, cold; about twice that.
    timeout-minutes: 40

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-work-tests"
      ASH_ONETIME_RLS_PRUNE_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres
        with:
          logical: true
      - uses: ./.github/actions/postgres-client
        with:
          version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      # Restore only; the cache warmer on the default branch writes the release cache.
      - uses: ./.github/actions/mix-cache
        with:
          mode: restore
          cell: release
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV='test' mix compile --warnings-as-errors
      - run: mix test --exclude exit_boundary

      - uses: ./.github/actions/postgres
        if: always()
        with:
          mode: stop
          logical: true

  comparator-matrix:
    name: "Comparator matrix (PostgreSQL ${{ matrix.postgres.major }}, ${{ matrix.route }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # New tuple partitions halve each local path batch; no merged green run yet.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.toolchain.outputs.postgres_all_lanes) }}
        route: ${{ fromJSON(needs.toolchain.outputs.matrix_routes) }}
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-matrix-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ matrix.postgres.client }}
          postgres-image: ${{ matrix.postgres.image }}
          postgres-major: ${{ matrix.postgres.major }}
          libpq-version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: matrix
          selector: ${{ matrix.route }}

  comparator-scheduling:
    name: "Comparator scheduling (PostgreSQL ${{ matrix.postgres.major }}, ${{ matrix.shard.name }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # One five-path group per shard, split from measured 29m13s double groups; no merged green run yet.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.toolchain.outputs.postgres_all_lanes) }}
        shard: ${{ fromJSON(needs.toolchain.outputs.scheduling_shards) }}
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-scheduling-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ matrix.postgres.client }}
          postgres-image: ${{ matrix.postgres.image }}
          postgres-major: ${{ matrix.postgres.major }}
          libpq-version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: scheduling
          selector: ${{ matrix.shard.name }}

  comparator-native:
    name: "Native connection prerequisites ${{ matrix.shard }} (PostgreSQL ${{ matrix.postgres.major }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Split from Work 45265968417 (cold PG18 44m12s); no green partition run yet.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.toolchain.outputs.postgres_all_lanes) }}
        shard: ${{ fromJSON(needs.toolchain.outputs.native_shards) }}
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-native-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ matrix.postgres.client }}
          postgres-image: ${{ matrix.postgres.image }}
          postgres-major: ${{ matrix.postgres.major }}
          libpq-version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: native
          selector: ${{ matrix.shard }}
          cache: none

  comparator-controls:
    name: "Comparator controls (PostgreSQL ${{ matrix.postgres.major }})"
    needs: [toolchain, comparator-native]
    runs-on: ubuntu-24.04
    # Platform cached 28m50s on Work 44873694440, plus historical 57s cold setup delta.
    # New declared-major cells have no green run yet; remeasure cold.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.toolchain.outputs.postgres_all_lanes) }}
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-controls-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ matrix.postgres.client }}
          postgres-image: ${{ matrix.postgres.image }}
          postgres-major: ${{ matrix.postgres.major }}
          libpq-version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: controls

  format:
    name: Format check
    needs: toolchain
    runs-on: ubuntu-24.04
    # First green: 81 s cached, Work 44856687648, job 136700490695,
    # 72851b17c3a0cfec7079383b97fd95f89b499f0b. Allow 44 s cold formatter overhead
    # measured in Work 44852145428, job 136685902792, 587776c0ae416a598b7882826ef7e976ca6e775a.
    # Twice the estimated cold duration is below the five-minute floor; remeasure on the first cold green.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: ./.github/actions/mix-cache
        with:
          mode: restore
          cell: release
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - name: Check formatting
        id: format
        run: mix format --check-formatted
      - name: Capture the formatter's proposed diff
        if: failure() && steps.format.outcome == 'failure'
        run: |
          mix format
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - name: Upload the formatting diff
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-diff
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: error
          retention-days: 7

  mutations:
    name: "Mutation battery ${{ matrix.shard }} of ${{ strategy.job-total }}"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Combined delivery/item-2 battery in 24 shared shards; no merged green run yet.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.toolchain.outputs.mutation_shards) }}

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-mutations-${{ strategy.job-index }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/mutations
        with:
          cache: restore
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}

  postgres-compatibility:
    name: "PostgreSQL ${{ matrix.postgres.major }} compatibility"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Warm green: 31 min 12 s, Work 44895344941; add three minutes for a cold build
    # (deps/build took 2 min 32 s in cold Work 44838423147). About twice that total.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.toolchain.outputs.postgres_lanes) }}

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-postgres-${{ strategy.job-index }}"
      ASH_ONETIME_POSTGRES_COMPAT_MAJOR: ${{ matrix.postgres.major }}
      ASH_ONETIME_RLS_PRUNE_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres
        with:
          image: ${{ matrix.postgres.image }}
          logical: true
      - uses: ./.github/actions/postgres-tls
      - uses: ./.github/actions/postgres-client
        with:
          version: ${{ matrix.postgres.client }}
          libpq-version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: ./.github/actions/mix-cache
        with:
          mode: restore
          cell: release
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV='test' mix compile --warnings-as-errors
      - run: mix test --exclude exit_boundary

      - uses: ./.github/actions/postgres
        if: always()
        with:
          mode: stop
          logical: true
      - uses: ./.github/actions/postgres-tls
        if: always()
        with:
          mode: stop

  compat:
    name: "Ash ${{ matrix.ash }}"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 32 min (Ash latest), run 44190160838, cold; about twice that.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # Floor: declared security floor (EEF-CVE-2026-96581; ADR 0004), locked in
        # locks/ash-floor/mix.lock.
        # Latest: the floating requirement, locked in mix.lock; the release gates' currency
        # check keeps that lock at the newest Ash 3.x.
        ash: ${{ fromJSON(format('["{0}","latest"]', needs.toolchain.outputs.ash_floor)) }}

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-compat-${{ strategy.job-index }}"
      ASH_ONETIME_ASH_VERSION: ${{ matrix.ash }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/compat
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          ash: ${{ matrix.ash }}
          resolution: locked
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  release-checks:
    name: "Release gates"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 14 min 23 s, run 44212940459, which restored a cache. A cold start adds
    # about 3 min: the dev compile took 86 s cold in run 44190160838 and the test compile
    # about as long. The docs build these gates now add has no run of its own here; allow
    # about 2 min. About twice 19 1/2 min; measured again on its first cold green run.
    timeout-minutes: 40

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-release"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-gates
        with:
          cache: restore
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  # The mutation battery, split into shards so no job runs past 45 minutes. Each shard runs
  # every Nth registered mutation (scripts/check_mutations.exs --shard); together they run
  # all of them once. Add a shard to the list when the slowest one nears 45 minutes.
  compatibility:
    name: Compatibility (${{ matrix.elixir && format('Elixir {0}, OTP {1}', matrix.elixir, matrix.otp) || 'no second toolchain declared' }})
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 19 min, run 44190160838, cold; about twice that.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # With no second toolchain in .tool-versions the job still runs, as one cell that
        # checks nothing and succeeds, so every result its verdict reads is a success.
        include: ${{ fromJSON(needs.toolchain.outputs.beam_lanes != '[]' && needs.toolchain.outputs.beam_lanes || '[{"elixir":"","otp":""}]') }}

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-lane-${{ strategy.job-index }}"

    steps:
      - if: matrix.elixir == ''
        run: echo ".tool-versions declares no second toolchain; nothing to run"
      - if: matrix.elixir != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.elixir != ''
        uses: ./.github/actions/compatibility-lane
        with:
          cache: restore
          elixir: ${{ matrix.elixir }}
          otp: ${{ matrix.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  security:
    name: "Security"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 2 min 9 s, run 44190160838 (three locks scanned). Five minutes is the floor for any job.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/security
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}

  # Require every work-head job, including every declared PostgreSQL major and shard.
  qualified:
    if: always()
    needs: [toolchain, lock, quality, tests, postgres-compatibility, compat, release-checks, mutations, compatibility, security, comparator-native, comparator-matrix, comparator-scheduling, comparator-controls, format]
    runs-on: ubuntu-24.04
    # Slowest green: 6 s, run 44145457629. Five minutes is the floor for any job.
    timeout-minutes: 5
    steps:
      - name: Require every work-head job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [f"{name} ({job['result']})" for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Work head refused: ' + ', '.join(failed))
          sys.exit(bool(failed))
          PY
