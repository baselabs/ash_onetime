name: Work

# Every push to a work branch runs the whole test suite, the whole mutation battery and the
# lock check on that branch head, before a landing candidate exists. It is never a verdict:
# no job is named qualified, ci.yml never calls it, and it cannot move main. Sessions never
# dispatch workflows, so a push starts it; there are no inputs.
#
# It refuses main and kci/ candidates. Any code a job runs can write the cache through the
# runner's token, so a run must hold only its own branch's cache scope: main's scope and a
# candidate's scope are what qualification runs restore. It restores caches and saves none.
#
# Lock changes: change mix.exs, or delete a package's entry from mix.lock to update it within
# its requirement, and push. When the lock is not current, the lock job resolves it, audits
# it, uploads it as the artifact mix-lock-<sha> and fails until that file is committed.
on:
  push:
    branches-ignore: [main, 'kci/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"
  ASH_ONETIME_SUPERUSER_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

jobs:
  toolchain:
    name: Refuse main and candidates; read toolchains
    runs-on: ubuntu-24.04
    # Same steps as ci.yml's toolchain job, slowest green 7 s, run 44145457629. Five minutes is
    # the floor for any job.
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      postgres_image: ${{ steps.versions.outputs.postgres_image }}
      postgres_client: ${{ steps.versions.outputs.postgres_client }}
      pgdg_key: ${{ steps.versions.outputs.pgdg_key }}
    steps:
      - name: Refuse the default branch, candidates and anything not a branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$REF" in
            "refs/heads/$DEFAULT_BRANCH" | refs/heads/kci/*)
              echo "::error::work runs refuse $REF: main and kci/ scopes feed qualification"
              exit 1 ;;
            refs/heads/*) ;;
            *)
              echo "::error::work runs only on branches, not $REF"
              exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read defaults and service pins at the branch head
        id: versions
        uses: ./.github/actions/toolchain

  lock:
    name: Lock check
    needs: toolchain
    runs-on: ubuntu-24.04
    # No run exists yet. Estimated from run 44145457629: uncached dependency fetch and both
    # audits are about two minutes; about twice that.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - name: Check the lock, resolving it when it is not current
        id: lock
        run: |
          if mix deps.get --check-locked; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mix deps.get
            git diff mix.lock
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: mix hex.audit
      - run: mix deps.audit
      - if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mix-lock-${{ github.sha }}
          path: mix.lock
          if-no-files-found: error
          retention-days: 7
      - if: steps.lock.outputs.changed == 'true'
        name: Require the resolved lock to be committed
        run: |
          echo "::error::mix.lock is not current; commit the artifact mix-lock-$GITHUB_SHA"
          exit 1

  tests:
    name: Test suite
    needs: toolchain
    runs-on: ubuntu-24.04
    # No run exists yet. Estimated from run 44145457629's Ash 3.37.2 job: mix test 14 min,
    # compile 81 s and setup; about twice that.
    timeout-minutes: 35

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-work-tests
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-work-tests"
      ASH_ONETIME_RLS_PRUNE_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres-client
        with:
          version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      # Restore only. Anything this run could write stays in this branch's cache scope.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ needs.toolchain.outputs.otp }}-elixir${{ needs.toolchain.outputs.elixir }}-release-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ needs.toolchain.outputs.otp }}-elixir${{ needs.toolchain.outputs.elixir }}-release-
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV='test' mix compile --warnings-as-errors
      - run: mix test

  mutations:
    name: Mutation battery
    needs: toolchain
    runs-on: ubuntu-24.04
    # No run exists yet. Estimated from run 44145457629's release gates: the mutation battery
    # 69 min, compile 81 s and setup; about twice that.
    timeout-minutes: 150

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-work-mutations
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-work-mutations"
      ASH_ONETIME_RLS_PRUNE_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres-client
        with:
          version: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      # Restore only. Anything this run could write stays in this branch's cache scope.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ needs.toolchain.outputs.otp }}-elixir${{ needs.toolchain.outputs.elixir }}-release-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ needs.toolchain.outputs.otp }}-elixir${{ needs.toolchain.outputs.elixir }}-release-
      - run: mix deps.get --check-locked
      - run: MIX_ENV='test' mix compile --warnings-as-errors
      - run: MIX_ENV='test' mix run scripts/check_mutations.exs -- all
