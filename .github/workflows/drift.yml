name: Upstream drift

# Reports upstream drift ahead of the locks, on the default branch's code, weekly or when
# dispatched. It never gates a landing and has no verdict job.
#
# What it runs, each job on the default branch's checkout:
# - compat: the Ash floor and the newest Ash 3.x, every dependency resolved fresh from
#   upstream (the one unlocked fetch in this repository), then the full battery;
# - release-checks: the release gates on the committed lock, whose currency check fails when
#   a direct dependency has a newer resolvable release;
# - mutations: the mutation battery on the committed lock, in the same shards as ci.yml;
# - compatibility: the second toolchain from .tool-versions on the committed lock;
# - security: the offline advisory scan and both audits on the committed lock, which surface
#   advisories and retirements published since the last candidate.
#
# It publishes nothing: contents: read, no secret, no environment. It reads and writes no
# cache: every job builds from nothing, so a report never rests on a cached build. It runs no
# pull-request code: it starts only from the schedule or a dispatch, refuses any ref but the
# default branch, and every checkout names that branch.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests require the dedicated loopback ash_onetime_test database as postgres.
# Use non-default port 18841 for the PostgreSQL service.
# Observer connections use the Repo URL. Each job's PostgreSQL is its own superuser
# container, so the privileged operation-hold tests run against it rather than skipping.
env:
  DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"
  ASH_ONETIME_SUPERUSER_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"

jobs:
  # .tool-versions lists defaults first, followed by the compatibility pairs.
  # mix.exs owns the Ash security floor used by the compatibility matrix.
  # .github/service-pins owns the PostgreSQL server image digest and client version.
  toolchain:
    name: Read suite toolchains
    runs-on: ubuntu-24.04
    # Same composite as ci.yml; slowest green there: 7 s, run 44145457629. Five minutes is the floor for any job.
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
      ash_floor: ${{ steps.versions.outputs.ash_floor }}
      postgres_image: ${{ steps.versions.outputs.postgres_image }}
      postgres_client: ${{ steps.versions.outputs.postgres_client }}
      pgdg_key: ${{ steps.versions.outputs.pgdg_key }}
      matrix_routes: ${{ steps.test-shards.outputs.matrix_routes }}
      scheduling_shards: ${{ steps.test-shards.outputs.scheduling_shards }}
      mutation_shards: ${{ steps.test-shards.outputs.mutation_shards }}
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      # The default branch is read from the repository, which every event can reach, rather than
      # from the event's payload.
      - name: Refuse any ref but the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ "$REF" != "refs/heads/$default_branch" ]; then
            echo "::error::drift runs only on refs/heads/$default_branch, not $REF"
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.default_branch }}
          persist-credentials: false
      - name: Read defaults, compatibility lanes, Ash floor, and service pins
        id: versions
        uses: ./.github/actions/toolchain
      - name: Read shared test partitions
        id: test-shards
        run: python3 scripts/ci_test_shards.py --outputs

  compat:
    name: "Ash ${{ matrix.ash }}"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Same composite as ci.yml; slowest green there: 32 min (Ash latest), run 44190160838, cold; about twice that.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # Floor: declared security floor (EEF-CVE-2026-96581; ADR 0004), newest of the rest.
        # Latest: newest published Ash 3.x within the declared range, newest of the rest.
        ash: ${{ fromJSON(format('["{0}","latest"]', needs.toolchain.outputs.ash_floor)) }}

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-compat-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-compat-${{ strategy.job-index }}"
      ASH_ONETIME_ASH_VERSION: ${{ matrix.ash }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/compat
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          ash: ${{ matrix.ash }}
          resolution: upstream
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  release-checks:
    name: "Release gates"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest green: 14 min 23 s, run 44212940459, which restored a cache. A cold start adds
    # about 3 min: the dev compile took 86 s cold in run 44190160838 and the test compile
    # about as long. The docs build these gates now add has no run of its own here; allow
    # about 2 min. About twice 19 1/2 min; measured again on its first cold green run.
    timeout-minutes: 40

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-release
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-release"

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-gates
        with:
          cache: none
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  comparator-matrix:
    name: "Comparator matrix (${{ matrix.route }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest cold green: 18 min 41 s, Work 44852145428, job 136685903346,
    # 587776c0ae416a598b7882826ef7e976ca6e775a; about twice that.
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.toolchain.outputs.matrix_routes) }}
    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-matrix-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-matrix-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          cache: none
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: matrix
          selector: ${{ matrix.route }}

  comparator-scheduling:
    name: "Comparator scheduling (${{ matrix.name }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest first green: 29 min 4 s cached, Work 44856687648, job 136700491478,
    # 72851b17c3a0cfec7079383b97fd95f89b499f0b. Add 57 s for cold setup: 147.09 s in
    # Work 44852145428, job 136685903247, 587776c0ae416a598b7882826ef7e976ca6e775a,
    # versus 90.85 s cached in Work 44856687648, job 136700491597 (same comparator action).
    # About twice that estimated cold duration; remeasure on the first cold green.
    timeout-minutes: 61
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.scheduling_shards) }}
    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-scheduling-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-scheduling-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          cache: none
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: scheduling
          selector: ${{ matrix.name }}

  comparator-controls:
    name: "Comparator controls"
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-controls
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-comparator-controls"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/comparator
        with:
          cache: none
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          lane: controls

  mutations:
    name: "Mutation battery ${{ matrix.shard }} of ${{ strategy.job-total }}"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Slowest cold green of the 16 shards: 24 min 41 s, Work 44852145428,
    # job 136685903064, 587776c0ae416a598b7882826ef7e976ca6e775a; about twice that.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # The same shards as ci.yml.
        shard: ${{ fromJSON(needs.toolchain.outputs.mutation_shards) }}

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-mutations-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-mutations-${{ strategy.job-index }}"

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/mutations
        with:
          cache: none
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}

  compatibility:
    name: Compatibility (${{ matrix.elixir && format('Elixir {0}, OTP {1}', matrix.elixir, matrix.otp) || 'no second toolchain declared' }})
    needs: toolchain
    runs-on: ubuntu-24.04
    # Same composite as ci.yml; slowest green there: 19 min, run 44190160838, cold; about twice that.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # With no second toolchain in .tool-versions the job still runs, as one cell that
        # checks nothing and succeeds, the same shape as ci.yml.
        include: ${{ fromJSON(needs.toolchain.outputs.beam_lanes != '[]' && needs.toolchain.outputs.beam_lanes || '[{"elixir":"","otp":""}]') }}

    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_onetime_test
        ports:
          - 18841:5432
        options: >-
          --hostname ao-${{ github.run_id }}-${{ github.run_attempt }}-lane-${{ strategy.job-index }}
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-lane-${{ strategy.job-index }}"

    steps:
      - if: matrix.elixir == ''
        run: echo ".tool-versions declares no second toolchain; nothing to run"
      - name: Check out the default branch
        if: matrix.elixir != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - if: matrix.elixir != ''
        uses: ./.github/actions/compatibility-lane
        with:
          cache: none
          elixir: ${{ matrix.elixir }}
          otp: ${{ matrix.otp }}
          postgres-client: ${{ needs.toolchain.outputs.postgres_client }}
          pgdg-key: ${{ needs.toolchain.outputs.pgdg_key }}

  security:
    name: "Security"
    needs: toolchain
    runs-on: ubuntu-24.04
    # Same composite as ci.yml; slowest green there: 2 min 9 s, run 44190160838 (three locks scanned). Five minutes is the floor for any job.
    timeout-minutes: 5

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.toolchain.outputs.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/security
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
