name: Publish to Hex

# Infra dispatches after the version commit qualifies on the default branch. A held release
# is finished by dispatching again on that commit after approval. Infra reads the archives
# back before tagging the commit named by served docs' release.json; this workflow creates
# neither a tag nor a GitHub release. Held runs export no release-assets.
on:
  workflow_dispatch:

permissions:
  contents: read

# Docs uploads have no conditional-create API. Serialize this workflow's dispatches so a
# second run checks the first run's served archives before deciding what is missing.
concurrency:
  group: hex-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # The Hex key lives only in the publish environment and only in the upload step's env.
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    outputs:
      version: ${{ steps.release.outputs.version }}
      package_sha256: ${{ steps.archives.outputs.package_sha256 }}
      ready: ${{ steps.read-back.outputs.ready }}
      published_commit: ${{ steps.read-back.outputs.published_commit }}
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
      postgres_client: ${{ steps.toolchain.outputs.postgres_client }}
      pgdg_key: ${{ steps.toolchain.outputs.pgdg_key }}
    env:
      MIX_ENV: dev
    steps:
      - name: Refuse any ref but the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ "$REF" != "refs/heads/$default_branch" ]; then
            echo "::error::publish runs only on refs/heads/$default_branch, not $REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # served docs may name an ancestor of this default-branch commit
          persist-credentials: false
      - name: Read the development toolchain
        id: toolchain
        uses: ./.github/actions/toolchain
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
      - name: Read the version and require dated release notes
        id: release
        run: |
          mkdir "$RUNNER_TEMP/ash-onetime-hex-upload"
          python3 scripts/release_archives.py notes "$RUNNER_TEMP/ash-onetime-release-assets"
          echo "version=$(python3 scripts/release_archives.py version)" >> "$GITHUB_OUTPUT"
      - name: Refuse a tagged version
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when absent; anything else is an error.
          tagged=0
          git ls-remote --exit-code --tags "https://github.com/$REPOSITORY.git" "refs/tags/v$VERSION" > /dev/null || tagged=$?
          case "$tagged" in
            2) ;;
            0) echo "::error::v$VERSION is already tagged"; exit 1 ;;
            *) echo "::error::cannot read the repository's tags (git exited $tagged)"; exit 1 ;;
          esac
      - name: Refuse to create a package
        run: |
          status=$(curl --connect-timeout 10 --max-time 30 -sS -o /dev/null -w '%{http_code}' https://hex.pm/api/packages/ash_onetime)
          case "$status" in
            200) echo "hex.pm has the package ash_onetime" ;;
            404) echo "::error::ash_onetime is absent from hex.pm; first publication is the owner's, made by the owner"; exit 1 ;;
            *) echo "::error::hex.pm answered $status for ash_onetime"; exit 1 ;;
          esac
      - run: mix local.hex 2.7.0 --force
      - run: mix local.rebar --force
      - name: Fetch dependencies
        run: mix deps.get --check-locked
      # The same build and inspection the release gates run on every candidate.
      - name: Build and inspect the package and docs archives
        id: archives
        run: python3 scripts/release_archives.py build "$RUNNER_TEMP/ash-onetime-release-assets"
      - name: Plan missing uploads without a key
        id: plan
        working-directory: ${{ runner.temp }}/ash-onetime-hex-upload
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/ash-onetime-release-assets"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/publish_hex_artifacts.exs" plan "$VERSION" "$assets/ash_onetime-$VERSION.tar" "$assets/ash_onetime-$VERSION-docs.tar.gz"
      - name: Upload only missing inspected archives
        id: upload
        working-directory: ${{ runner.temp }}/ash-onetime-hex-upload
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_PLAN: ${{ steps.plan.outputs.package }}
          DOCS_PLAN: ${{ steps.plan.outputs.docs }}
        run: |
          assets="$RUNNER_TEMP/ash-onetime-release-assets"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/publish_hex_artifacts.exs" upload "$VERSION" "$assets/ash_onetime-$VERSION.tar" "$assets/ash_onetime-$VERSION-docs.tar.gz" "$PACKAGE_PLAN" "$DOCS_PLAN"
      - name: Read both archives back without a key
        id: read-back
        working-directory: ${{ runner.temp }}/ash-onetime-hex-upload
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STAGED: ${{ steps.upload.outputs.staged }}
        run: |
          assets="$RUNNER_TEMP/ash-onetime-release-assets"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/publish_hex_artifacts.exs" read-back "$VERSION" "$assets/ash_onetime-$VERSION.tar" "$assets/ash_onetime-$VERSION-docs.tar.gz" "$STAGED" "$GITHUB_WORKSPACE" "$GITHUB_SHA"
      # Read-back keeps the served docs, which can differ from this run's ExDoc output.
      - name: Checksum the package and served docs
        if: steps.read-back.outputs.ready == 'true'
        run: python3 scripts/release_archives.py checksums "$RUNNER_TEMP/ash-onetime-release-assets"
      - name: Upload release-assets for consumer verification
        if: steps.read-back.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/ash-onetime-release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's temporary release files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ash-onetime-release-assets" "$RUNNER_TEMP/ash-onetime-hex-upload"

  published-livebooks:
    name: Published Livebooks
    needs: publish
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    env:
      DATABASE_URL: "ecto://postgres:postgres@127.0.0.1:18841/ash_onetime_test"
      ASH_ONETIME_TEST_SERVER: "ao-${{ github.run_id }}-${{ github.run_attempt }}-published"
    steps:
      - name: Explain a held publication
        if: needs.publish.outputs.ready != 'true'
        run: echo "::notice::Published Livebooks await both archives; dispatch again on this commit after approval to finish"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.publish.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres
        if: needs.publish.outputs.ready == 'true'
      - uses: ./.github/actions/postgres-client
        if: needs.publish.outputs.ready == 'true'
        with:
          version: ${{ needs.publish.outputs.postgres_client }}
          pgdg-key: ${{ needs.publish.outputs.pgdg_key }}
      - uses: ./.github/actions/beam
        if: needs.publish.outputs.ready == 'true'
        with:
          elixir: ${{ needs.publish.outputs.elixir }}
          otp: ${{ needs.publish.outputs.otp }}
      - name: Install pinned Hex and Rebar
        if: needs.publish.outputs.ready == 'true'
        run: |
          mix local.hex 2.7.0 --force
          mix local.rebar --force
      - name: Wait until the published package is served
        if: needs.publish.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          PACKAGE_SHA256: ${{ needs.publish.outputs.package_sha256 }}
        run: |
          archive="$RUNNER_TEMP/ash-onetime-published.tar"
          trap 'rm -f -- "$archive"' EXIT
          for attempt in $(seq 1 12); do
            status=$(curl --connect-timeout 10 --max-time 30 -sS -o "$archive" -w '%{http_code}' "https://repo.hex.pm/tarballs/ash_onetime-$VERSION.tar")
            case "$status" in
              200) printf '%s  %s\n' "$PACKAGE_SHA256" "$archive" | sha256sum --check; exit 0 ;;
              404) ;;
              *) echo "::error::repo.hex.pm answered $status"; exit 1 ;;
            esac
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::ash_onetime $VERSION was not served before the wait ended"
          exit 1
      - name: Execute published Livebook source cells
        if: needs.publish.outputs.ready == 'true'
        run: elixir scripts/check_livebooks.exs --published
      - uses: ./.github/actions/postgres
        if: always() && needs.publish.outputs.ready == 'true'
        with:
          mode: stop
