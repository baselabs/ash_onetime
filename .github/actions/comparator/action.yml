name: Delivery comparator
description: Run one declared comparator partition on the job's declared disposable PostgreSQL engine
inputs:
  elixir:
    description: Exact Elixir build
    required: true
  otp:
    description: Exact Erlang/OTP build
    required: true
  postgres-client:
    description: Pinned PostgreSQL client package version
    required: true
  postgres-image:
    description: Declared upstream image; empty selects the checked platform engine
    default: ''
  postgres-major:
    description: Declared PostgreSQL major from the toolchain lane
    default: ''
  libpq-version:
    description: Platform libpq package pin for compatibility clients
    default: ''
  pgdg-key:
    description: PGDG apt signing key fingerprint
    required: true
  cache:
    description: Restore qualified caches, or none for upstream drift
    default: restore
  lane:
    description: matrix, scheduling, native or controls
    required: true
  selector:
    description: Route or scheduling shard name; empty for native or controls
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/postgres
      with:
        image: ${{ inputs.postgres-image }}
    - name: Select the declared compatibility contract
      if: inputs.postgres-image != ''
      shell: bash
      env:
        MAJOR: ${{ inputs.postgres-major }}
      run: echo "ASH_ONETIME_POSTGRES_COMPAT_MAJOR=$MAJOR" >> "$GITHUB_ENV"
    - uses: ./.github/actions/postgres-tls
      if: inputs.lane == 'native'
    - name: Refuse an unknown cache input
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
      run: |
        case "$CACHE" in
          restore | none) ;;
          *) echo "::error::cache must be restore or none"; exit 1 ;;
        esac
    - uses: ./.github/actions/postgres-client
      with:
        version: ${{ inputs.postgres-client }}
        libpq-version: ${{ inputs.libpq-version }}
        pgdg-key: ${{ inputs.pgdg-key }}
    - uses: ./.github/actions/beam
      with:
        elixir: ${{ inputs.elixir }}
        otp: ${{ inputs.otp }}
    - if: inputs.cache == 'restore'
      uses: ./.github/actions/mix-cache
      with:
        mode: restore
        cell: release
        elixir: ${{ inputs.elixir }}
        otp: ${{ inputs.otp }}
    - shell: bash
      run: mix deps.get --check-locked
    - shell: bash
      run: MIX_ENV=test mix compile --warnings-as-errors
    - name: Run the declared comparator partition
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        SELECTOR: ${{ inputs.selector }}
      run: python3 scripts/ci_test_shards.py "$LANE" "$SELECTOR"
    - uses: ./.github/actions/postgres
      if: always()
      with:
        mode: stop
        image: ${{ inputs.postgres-image }}
    - uses: ./.github/actions/postgres-tls
      if: always() && inputs.lane == 'native'
      with:
        mode: stop
