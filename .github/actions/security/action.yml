name: Security
description: Run the security battery for qualification and upstream drift
inputs:
  elixir:
    description: Exact Elixir build from the toolchain job
    required: true
  otp:
    description: Exact Erlang/OTP build from the toolchain job
    required: true

# Supply-chain advisories on the committed lock, failing closed. osv-scanner (one pinned 2.x
# release, checksum-verified) runs offline: the public Hex advisory database is downloaded
# first, with nothing from the lock sent, and the scan then runs in a network namespace with
# no network. It fails on any published advisory affecting a locked version, with no
# database, or when the number of packages it reports differs from the lock's hex and git
# entries. hex.audit fails on any retired package.
runs:
  using: composite
  steps:
    - name: Install osv-scanner and download the Hex advisory database
      env:
        OSV_SCANNER_VERSION: "2.7.1"
        OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
      shell: bash
      run: |
        curl -sSfLo "$RUNNER_TEMP/osv-scanner" \
          "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
        echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
        chmod +x "$RUNNER_TEMP/osv-scanner"
        mkdir -p "$RUNNER_TEMP/osv-db/osv-scalibr/Hex"
        curl -sSfLo "$RUNNER_TEMP/osv-db/osv-scalibr/Hex/all.zip" \
          "https://osv-vulnerabilities.storage.googleapis.com/Hex/all.zip"

    - name: Scan every committed lock offline, with the network denied
      shell: bash
      run: |
        if sudo unshare --net -- curl -sS -m 5 -o /dev/null https://osv.dev 2>/dev/null; then
          echo "network is reachable inside the scan namespace" >&2
          exit 1
        fi
        for lock in mix.lock locks/ash-floor/mix.lock test/support/fixtures/advisory_scan/mix.lock; do
          name="$(echo "$lock" | tr '/.' '__')"
          sudo unshare --net -- env OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$RUNNER_TEMP/osv-db" \
            "$RUNNER_TEMP/osv-scanner" scan source --offline --all-packages --format json \
            --output-file "$RUNNER_TEMP/osv-$name.json" -L "$lock"
        done

    - uses: ./.github/actions/beam
      with:
        elixir: ${{ inputs.elixir }}
        otp: ${{ inputs.otp }}

    - shell: bash
      run: mix deps.get --check-locked

    # The scan must cover every hex and git lock entry. The fixture lock holds one of each,
    # proving git entries are counted on both sides.
    - name: Check the scan covered the whole lock
      shell: bash
      run: |
        for lock in mix.lock locks/ash-floor/mix.lock test/support/fixtures/advisory_scan/mix.lock; do
          name="$(echo "$lock" | tr '/.' '__')"
          mix run --no-start --no-compile --no-deps-check scripts/check_advisory_scan.exs \
            "$lock" "$RUNNER_TEMP/osv-$name.json"
        done

    # Both audits read mix.lock: hex.audit for retirements and the advisories Hex carries,
    # deps.audit for the advisory database. Neither contains the other's findings. The compat
    # floor cell runs both against locks/ash-floor/mix.lock.
    - shell: bash
      run: mix hex.audit
    - shell: bash
      run: mix deps.audit
