name: Read suite toolchains
description: Validate and read the shared BEAM toolchains, declared Ash floor and service pins
outputs:
  elixir:
    description: Default Elixir build
    value: ${{ steps.versions.outputs.elixir }}
  otp:
    description: Default Erlang/OTP build
    value: ${{ steps.versions.outputs.otp }}
  beam_lanes:
    description: Additional Elixir and Erlang/OTP pairs as JSON
    value: ${{ steps.versions.outputs.beam_lanes }}
  ash_floor:
    description: Declared Ash security floor from mix.exs
    value: ${{ steps.ash-floor.outputs.ash_floor }}
  postgres_client:
    description: PGDG PostgreSQL client package version from .github/service-pins
    value: ${{ steps.service-pins.outputs.postgres_client }}
  postgres_lanes:
    description: Declared upstream PostgreSQL compatibility images and matching clients as JSON
    value: ${{ steps.service-pins.outputs.postgres_lanes }}
  pgdg_key:
    description: PGDG apt signing key fingerprint from .github/service-pins
    value: ${{ steps.service-pins.outputs.pgdg_key }}
  mutation_shards:
    description: Shared mutation shard list as JSON
    value: ${{ steps.mutation-shards.outputs.mutation_shards }}
runs:
  using: composite
  steps:
    - name: Read the shared mutation shards
      id: mutation-shards
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path

        shards = json.loads(Path('.github/mutation-shards.json').read_text())
        if not shards or shards != list(range(1, len(shards) + 1)):
            raise SystemExit('Mutation shards must be consecutive integers starting at 1')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'mutation_shards={json.dumps(shards)}\n')
        PYTHON
    - name: Validate the shared toolchain reader
      shell: bash
      run: sh scripts/toolchain.sh --self-test
    - name: Read defaults and compatibility lanes
      id: versions
      shell: bash
      run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"
    - name: Read the declared Ash security floor
      id: ash-floor
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import os
        import re
        from pathlib import Path

        declarations = re.findall(r'^[ \t]*@ash_floor\b[^\n]*$', Path('mix.exs').read_text(), re.MULTILINE)
        if len(declarations) != 1:
            raise SystemExit('Expected exactly one @ash_floor declaration in mix.exs')
        floor = re.fullmatch(r'[ \t]*@ash_floor[ \t]+"([0-9]+\.[0-9]+\.[0-9]+)"[ \t]*', declarations[0])
        if floor is None:
            raise SystemExit('Expected @ash_floor to declare a stable version string')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'ash_floor={floor[1]}\n')
        PYTHON
    - name: Read the service pins
      id: service-pins
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        import re
        from pathlib import Path

        patterns = {
            'postgres_client': r'[0-9]+\.[0-9]+-[0-9]+\.pgdg24\.04\+[0-9]+',
            'pgdg_key': r'[0-9A-F]{40}',
        }
        entries = {}
        for line in Path('.github/service-pins').read_text().splitlines():
            if not line.strip() or line.lstrip().startswith('#'):
                continue
            name, separator, value = line.partition('=')
            if not separator or name not in patterns or name in entries:
                raise SystemExit(f'Unexpected or repeated entry in .github/service-pins: {line}')
            if re.fullmatch(patterns[name], value) is None:
                raise SystemExit(f'{name} in .github/service-pins is not an exact pin: {value}')
            entries[name] = value
        missing = sorted(set(patterns) - set(entries))
        if missing:
            raise SystemExit('Missing from .github/service-pins: ' + ', '.join(missing))
        engine = Path('.github/postgres.ref').read_text().strip()
        major = re.fullmatch(r'ghcr\.io/baselabs/postgres:([0-9]+)\.[0-9]+-inputs-[0-9a-f]{64}@sha256:[0-9a-f]{64}', engine)
        if major is None or entries['postgres_client'].split('.')[0] != major[1]:
            raise SystemExit('The PGDG client major must match .github/postgres.ref')
        lanes = json.loads(Path('.github/postgres-compat.json').read_text())
        if not isinstance(lanes, list) or not lanes:
            raise SystemExit('Declare the supported non-platform majors in .github/postgres-compat.json')
        seen = {major[1]}
        for lane in lanes:
            if not isinstance(lane, dict) or set(lane) != {'major', 'image', 'client'}:
                raise SystemExit('Each PostgreSQL lane must declare major, image and client exactly once')
            if not all(isinstance(value, str) for value in lane.values()):
                raise SystemExit('PostgreSQL lane pins must be strings')
            if re.fullmatch(r'[1-9][0-9]*', lane['major']) is None or lane['major'] in seen:
                raise SystemExit('PostgreSQL compatibility majors must be unique and exclude the platform major')
            seen.add(lane['major'])
            image = re.fullmatch(r'postgres:([0-9]+)\.[0-9]+@sha256:[0-9a-f]{64}', lane['image'])
            if image is None or image[1] != lane['major']:
                raise SystemExit('The upstream PostgreSQL image must pin its declared major, patch and digest')
            if re.fullmatch(patterns['postgres_client'], lane['client']) is None or lane['client'].split('.')[0] != lane['major']:
                raise SystemExit('Each PGDG client must pin its compatibility server major')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for name, value in entries.items():
                output.write(f'{name}={value}\n')
            output.write(f'postgres_lanes={json.dumps(lanes)}\n')
        PYTHON
