name: Platform PostgreSQL
description: Start or remove this job's disposable platform engine and optional logical server
inputs:
  mode:
    description: start or stop
    required: false
    default: start
  logical:
    description: Also manage a dedicated logical replication server on port 18842
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Check the public platform engine and pull its digest
      if: inputs.mode == 'start'
      shell: bash
      run: |
        engine="$(cat .github/postgres.ref)"
        [[ "$engine" =~ ^ghcr\.io/baselabs/postgres:[0-9]+\.[0-9]+-inputs-[0-9a-f]{64}@sha256:[0-9a-f]{64}$ ]]
        current_digest="$(python3 - <<'PY'
        import json, re, urllib.request
        host, path = 'ghcr.io', 'baselabs/postgres'
        with urllib.request.urlopen(f'https://{host}/token?scope=repository:{path}:pull', timeout=30) as response:
            token = json.load(response)['token']
        request = urllib.request.Request(f'https://{host}/v2/{path}/manifests/current', method='HEAD', headers={
            'Authorization': 'Bearer ' + token,
            'Accept': ', '.join(('application/vnd.oci.image.index.v1+json', 'application/vnd.oci.image.manifest.v1+json',
                                 'application/vnd.docker.distribution.manifest.list.v2+json',
                                 'application/vnd.docker.distribution.manifest.v2+json'))})
        with urllib.request.urlopen(request, timeout=30) as response:
            digest = response.headers.get('Docker-Content-Digest', '')
        if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
            raise SystemExit('ghcr.io/baselabs/postgres:current: registry named no digest')
        print(digest)
        PY
        )"
        if [ "${engine##*@}" != "$current_digest" ]; then
          echo 'checked PostgreSQL digest differs from ghcr.io/baselabs/postgres:current' >&2; exit 1
        fi
        docker pull "$engine"
    - name: Log PostgreSQL servers after a failure
      if: inputs.mode == 'stop' && failure()
      shell: bash
      env:
        LOGICAL: ${{ inputs.logical }}
      run: |
        set -euo pipefail
        server="${ASH_ONETIME_TEST_SERVER:?}"
        case "$server" in
          "ao-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-"*) ;;
          *) echo "::error::PostgreSQL requires this run's server hostname"; exit 1 ;;
        esac
        servers=("$server")
        if [ "$LOGICAL" = true ]; then servers+=("$server-logical"); fi
        for container in "${servers[@]}"; do
          if docker container inspect "$container" > /dev/null 2>&1; then
            docker logs "$container"
          fi
        done
    - name: Manage the disposable PostgreSQL servers
      if: always() && (inputs.mode == 'stop' || success())
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        LOGICAL: ${{ inputs.logical }}
        # Throwaway fixture values, never credentials for an external service.
        TEST_PG_USER: postgres
        TEST_PG_PASSWORD: postgres
        TEST_PG_DATABASE: ash_onetime_test
      run: |
        set -euo pipefail
        server="${ASH_ONETIME_TEST_SERVER:?}"
        case "$server" in
          "ao-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-"*) ;;
          *) echo "::error::PostgreSQL requires this run's server hostname"; exit 1 ;;
        esac
        case "$MODE" in
          start | stop) ;;
          *) echo "::error::mode must be start or stop"; exit 1 ;;
        esac
        case "$LOGICAL" in
          true) servers=("$server" "$server-logical") ;;
          false) servers=("$server") ;;
          *) echo "::error::logical must be true or false"; exit 1 ;;
        esac

        cleanup_status=0
        for container in "${servers[@]}"; do
          if [ "$MODE" = stop ]; then
            if docker container inspect "$container" > /dev/null 2>&1; then
              if ! docker rm -f -v "$container"; then cleanup_status=1; fi
            fi
            continue
          fi

          port=18841
          settings=()
          if [ "$container" = "$server-logical" ]; then
            port=18842
            settings=(-c wal_level=logical -c logging_collector=on -c log_destination=csvlog)
          fi
          engine="$(cat .github/postgres.ref)"
          docker run --detach --pull=never --name "$container" --hostname "$container" \
            --env TEST_PG_USER --env TEST_PG_PASSWORD --env TEST_PG_DATABASE \
            --tmpfs /var/lib/pg:uid=26,gid=26,mode=0750 --tmpfs /tmp \
            --publish "127.0.0.1:$port:5432" "$engine" \
            baselabs-test-postgres "${settings[@]}"
          ready=false
          for ((attempt=0; attempt<60; attempt++)); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U "$TEST_PG_USER" -d "$TEST_PG_DATABASE"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            echo "::error::PostgreSQL did not become ready within 60 attempts"
            exit 1
          fi
        done
        if [ "$MODE" = start ] && [ "$LOGICAL" = true ]; then
          echo 'ASH_ONETIME_LOGICAL_URL=ecto://postgres:postgres@127.0.0.1:18842/ash_onetime_test' >> "$GITHUB_ENV"
        fi
        exit "$cleanup_status"
