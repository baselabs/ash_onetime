name: Disposable PostgreSQL
description: Start or remove this job's platform or declared compatibility engine and optional logical server
inputs:
  mode:
    description: start or stop
    required: false
    default: start
  logical:
    description: Also manage a dedicated logical replication server on port 18842
    required: false
    default: 'false'
  image:
    description: Upstream compatibility image from the toolchain reader; empty uses the checked platform engine
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check the public platform engine and pull its digest
      if: inputs.mode == 'start' && inputs.image == ''
      shell: bash
      run: |
        engine="$(cat .github/postgres.ref)"
        [[ "$engine" =~ ^ghcr\.io/baselabs/postgres:[0-9]+\.[0-9]+-inputs-[0-9a-f]{64}@sha256:[0-9a-f]{64}$ ]]
        current_digest="$(python3 - <<'PY'
        import json, re, time, urllib.error, urllib.request
        host, path = 'ghcr.io', 'baselabs/postgres'
        def read(request, answer):
            for attempt in range(3):
                try:
                    with urllib.request.urlopen(request, timeout=30) as response:
                        return answer(response)
                except urllib.error.HTTPError as error:
                    if (error.code != 429 and error.code < 500) or attempt == 2:
                        raise
                except OSError:
                    if attempt == 2:
                        raise
                time.sleep(10 * (attempt + 1))
        token = read(f'https://{host}/token?scope=repository:{path}:pull', lambda response: json.load(response)['token'])
        request = urllib.request.Request(f'https://{host}/v2/{path}/manifests/current', method='HEAD', headers={
            'Authorization': 'Bearer ' + token,
            'Accept': ', '.join(('application/vnd.oci.image.index.v1+json', 'application/vnd.oci.image.manifest.v1+json',
                                 'application/vnd.docker.distribution.manifest.list.v2+json',
                                 'application/vnd.docker.distribution.manifest.v2+json'))})
        digest = read(request, lambda response: response.headers.get('Docker-Content-Digest', ''))
        if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
            raise SystemExit('ghcr.io/baselabs/postgres:current: registry named no digest')
        print(digest)
        PY
        )"
        if [ "${engine##*@}" != "$current_digest" ]; then
          echo 'checked PostgreSQL digest differs from ghcr.io/baselabs/postgres:current' >&2; exit 1
        fi
        docker pull "$engine"
    - name: Pull the declared upstream compatibility image
      if: inputs.mode == 'start' && inputs.image != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        [[ "$IMAGE" =~ ^postgres:[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
        docker pull "$IMAGE"
    - name: Manage the disposable PostgreSQL servers
      if: always() && (inputs.mode == 'stop' || success())
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        LOGICAL: ${{ inputs.logical }}
        IMAGE: ${{ inputs.image }}
        # Throwaway fixture values, never credentials for an external service.
        TEST_PG_USER: postgres
        TEST_PG_PASSWORD: postgres
        TEST_PG_DATABASE: ash_onetime_test
      run: |
        set -euo pipefail
        server="${ASH_ONETIME_TEST_SERVER:?}"
        case "$server" in
          "ao-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-"*) ;;
          *) echo "::error::PostgreSQL requires this run's server hostname"; exit 1 ;;
        esac
        case "$MODE" in
          start | stop) ;;
          *) echo "::error::mode must be start or stop"; exit 1 ;;
        esac
        case "$LOGICAL" in
          true) servers=("$server" "$server-logical") ;;
          false) servers=("$server") ;;
          *) echo "::error::logical must be true or false"; exit 1 ;;
        esac

        cleanup_status=0
        for container in "${servers[@]}"; do
          if [ "$MODE" = stop ]; then
            if docker container inspect "$container" > /dev/null 2>&1; then
              if ! docker logs "$container"; then cleanup_status=1; fi
              if ! docker rm -f -v "$container"; then cleanup_status=1; fi
            fi
            continue
          fi

          port=18841
          settings=()
          if [ "$container" = "$server-logical" ]; then
            port=18842
            settings=(-c wal_level=logical -c logging_collector=on -c log_destination=csvlog)
          fi
          if [ -z "$IMAGE" ]; then
            engine="$(cat .github/postgres.ref)"
            startup=(--env TEST_PG_USER --env TEST_PG_PASSWORD --env TEST_PG_DATABASE
              --tmpfs /var/lib/pg:uid=26,gid=26,mode=0750 --tmpfs /tmp
              --entrypoint baselabs-test-postgres "$engine")
          else
            # Use upstream's native entrypoint. initdb's explicit host auth covers
            # loopback and replication too; the entrypoint adds the all-host rule.
            export POSTGRES_USER="$TEST_PG_USER" POSTGRES_PASSWORD="$TEST_PG_PASSWORD"
            export POSTGRES_DB="$TEST_PG_DATABASE" PGDATA=/var/lib/pg/data
            export POSTGRES_INITDB_ARGS='--auth-local=trust --auth-host=scram-sha-256'
            export POSTGRES_HOST_AUTH_METHOD=scram-sha-256
            startup=(--env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB
              --env POSTGRES_INITDB_ARGS --env POSTGRES_HOST_AUTH_METHOD --env PGDATA
              --tmpfs /var/lib/pg:mode=0755 --tmpfs /tmp "$IMAGE"
              -c unix_socket_directories=/var/run/postgresql,/tmp -c password_encryption=scram-sha-256
              -c 'listen_addresses=*')
          fi
          docker run --detach --pull=never --name "$container" --hostname "$container" \
            --publish "127.0.0.1:$port:5432" \
            "${startup[@]}" "${settings[@]}"
          ready=false
          for ((attempt=0; attempt<60; attempt++)); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U "$TEST_PG_USER" -d "$TEST_PG_DATABASE"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            echo "::error::PostgreSQL did not become ready within 60 attempts"
            exit 1
          fi
        done
        if [ "$MODE" = start ] && [ "$LOGICAL" = true ]; then
          echo 'ASH_ONETIME_LOGICAL_URL=ecto://postgres:postgres@127.0.0.1:18842/ash_onetime_test' >> "$GITHUB_ENV"
        fi
        exit "$cleanup_status"
